name: spatial-demo
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyarrow
  - matplotlib-base
  - seaborn           # styling only; all plots are plain matplotlib
  - h5py
  - jupyterlab
  - nbconvert
  - ipykernel
  - pip
  - pip:
      - scanpy>=1.10
      - anndata>=0.10
